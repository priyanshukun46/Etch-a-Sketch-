<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Etch-a-Sketch </title>
	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="title">Etch-a-Sketch </div>
        
        <div class="app">
            <div class="container"></div>

            
            <div class="tools">
                <div class="func"><h2>Tools</h2></div>
                <div class="color">
                    <label for="themeColor"><h3>Choose Color:</h3></label>
                    <input type="color" id="themeColor" name="themeColor" value="#ff0000">
                    <h3>Select random color:  <button>Random</button>
                    </h3>
                </div>
                <div class="buttons">
                    <div class="erase">
                        <button>Erase</button>
                    </div>
                    
                    <div class="reset">
                        <button>Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
